services:
  - type: cron
    name: maine-bmv-scraper
    runtime: docker
    dockerfilePath: ./scraper/Dockerfile
    dockerContext: ./scraper
    schedule: "*/10 * * * *"
    envVars:
      - key: SUPABASE_URL
        value: https://jkrputchfqejmcoudmrc.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false   # set manually in Render dashboard
      - key: RESEND_API_KEY
        sync: false   # set manually in Render dashboard
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEBUG
        value: "false"
